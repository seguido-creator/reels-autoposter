name: Free voice test

# Renders sample narration with the free Kokoro-82M voice model (Apache 2.0, CPU) and saves the samples to Drive.
on:
  workflow_dispatch:
    inputs:
      lines:
        description: "Narration lines separated by | (empty = the 6-voice sample test)"
        required: false
        default: ""
      voice:
        description: "Kokoro voice id, or gemini:Voice1,Voice2 for Gemini TTS samples"
        required: false
        default: "am_michael"
      speed:
        description: "Speaking speed"
        required: false
        default: "1.0"
      style:
        description: "Gemini voices only: speaking style note"
        required: false
        default: ""

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg espeak-ng
          pip install -q -r requirements.txt "kokoro>=0.9.2" soundfile
      - name: Make samples
        env:
          LINES: ${{ inputs.lines }}
          VOICE: ${{ inputs.voice }}
          SPEED: ${{ inputs.speed }}
          STYLE: ${{ inputs.style }}
        run: python voice_test.py
