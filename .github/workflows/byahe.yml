name: Byahe ni Nanay

# Manual tools for the Byahe ni Nanay Page. Daily posting runs inside runner.yml (byahe.py).
on:
  workflow_dispatch:
    inputs:
      task:
        description: "check = test token, Drive folder and queue (posts nothing). post-now = post the next video now (only when live)."
        type: choice
        options: ["check", "post-now"]
        default: check

concurrency:
  group: byahe
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      FB_PAGE_ID_BYA: ${{ secrets.FB_PAGE_ID_BYA }}
      FB_TOKEN_BYA: ${{ secrets.FB_TOKEN_BYA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get install -y -qq ffmpeg && pip install -q -r requirements.txt
      - name: Run
        run: |
          if [ "${{ inputs.task }}" = "post-now" ]; then python byahe.py --now; else python byahe.py --check; fi
