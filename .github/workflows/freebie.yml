name: Freebie Reel

# Launch Reel for a free download (see freebie_reel.py). Preview first; post only after approval and
# after the Page's keyword auto-reply is switched ON.
on:
  workflow_dispatch:
    inputs:
      name:
        description: "Freebie name (e.g. ipon)"
        required: true
        default: "ipon"
      mode:
        description: "preview = save the video to Drive only, post = publish on the Page"
        type: choice
        options: [preview, post]
        default: preview

concurrency:
  group: freebie
  cancel-in-progress: false

jobs:
  freebie:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      TTS_MODEL: ${{ vars.TTS_MODEL }}
      FB_PAGE_ID_FIN: ${{ secrets.FB_PAGE_ID_FIN }}
      FB_TOKEN_FIN: ${{ secrets.FB_TOKEN_FIN }}
      RENDER_ENGINE: remotion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo -E apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core fonts-liberation poppler-utils libreoffice-calc-nogui
          pip install -q -r requirements.txt pillow fonttools brotli
          python fetch_fonts.py
          cd remotion && npm install --no-audit --no-fund --loglevel=error && npx remotion browser ensure

      - name: Make the freebie Reel
        run: python freebie_reel.py --name "${{ inputs.name }}" --mode "${{ inputs.mode }}"
