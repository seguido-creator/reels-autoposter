name: Prepare Reels

on:
  schedule:
    - cron: "20 1,7,13,19 * * *"   # 4x a day (05:20, 11:20, 17:20, 23:20 UAE time); exits fast when buffers are full
  workflow_dispatch:
    inputs:
      page:
        description: "Only this page (US, UAE or PH). Leave blank for all."
        required: false
        default: ""

concurrency:
  group: prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      LIBRARY_FOLDER_ID: ${{ secrets.LIBRARY_FOLDER_ID }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      FB_PAGE_ID_US: ${{ secrets.FB_PAGE_ID_US }}
      FB_TOKEN_US: ${{ secrets.FB_TOKEN_US }}
      FB_PAGE_ID_UAE: ${{ secrets.FB_PAGE_ID_UAE }}
      FB_TOKEN_UAE: ${{ secrets.FB_TOKEN_UAE }}
      FB_PAGE_ID_PH: ${{ secrets.FB_PAGE_ID_PH }}
      FB_TOKEN_PH: ${{ secrets.FB_TOKEN_PH }}
      TTS_MODEL: ${{ vars.TTS_MODEL }}
      ONLY_PAGE: ${{ inputs.page || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -r requirements.txt
      - name: Build enhanced reels
        run: python prepare.py $ONLY_PAGE
